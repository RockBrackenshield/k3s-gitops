# Break-glass admin credentials for Grafana.
# Local login is kept enabled; use these only when Authentik is unreachable.
#
# TO SEAL:
#   1. Create the plaintext Secret (do NOT commit this file):
#
#      cat <<EOF > /tmp/grafana-admin-secret.yaml
#      apiVersion: v1
#      kind: Secret
#      metadata:
#        name: grafana-admin
#        namespace: monitoring
#      stringData:
#        admin-user: admin
#        admin-password: <YOUR_SECURE_PASSWORD>
#      EOF
#
#   2. Seal it:
#      printf '' | kubeseal --format yaml \
#        --secret-file /tmp/grafana-admin-secret.yaml \
#        > apps/monitoring/kube-prometheus-stack/resources/sealed-secret-grafana-admin.yaml
#
#   3. Shred the plaintext:
#      shred -u /tmp/grafana-admin-secret.yaml
#
# NOTE: Use printf-based piping (not echo) to avoid trailing-newline corruption.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring