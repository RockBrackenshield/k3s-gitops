---
# SOPS creation rules (age). Public recipients only - safe to commit.
# REPLACE the placeholder with your age public key before encrypting anything:
#   age-keygen -o ~/.config/sops/age/keys.txt   # prints "Public key: age1..."
# sops refuses to encrypt while the placeholder is present.
# Rotation / second recipient: add the key to BOTH rules, then
#   sops updatekeys -y talos/secrets.sops.yaml talos/nodes/*.tailscale.sops.yaml
creation_rules:
  - path_regex: ^talos/secrets\.sops\.yaml$
    age: >-
      age1pqywwqukuqw85q8gfsey9xwpn8z8z6xm56k0anjvel78d3h7pd6qqnqrdl
  - path_regex: ^talos/.*\.sops\.yaml$   # nodes/*.tailscale.sops.yaml etc.
    age: >-
      age1pqywwqukuqw85q8gfsey9xwpn8z8z6xm56k0anjvel78d3h7pd6qqnqrdl
