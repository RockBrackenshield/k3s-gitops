# k3s-gitops/ansible/restore.yaml
# ---
# Disaster-recovery playbook. Run this on a freshly provisioned set of nodes.
# Prerequisite: Place the backed-up sealed-secrets-master-key.yaml at
#   ansible/roles/argocd_bootstrap/files/sealed-secrets-master-key.yaml
# before executing. See docs/runbook-restore.md for full procedure.

- name: Apply common configuration to all nodes
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common

- name: Install K3s control plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: k3s_server

- name: Install K3s worker agents
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: k3s_agent

- name: Configure USB storage on control plane
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - role: usb_storage

- name: Restore Sealed Secrets key and bootstrap ArgoCD
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - role: argocd_bootstrap
