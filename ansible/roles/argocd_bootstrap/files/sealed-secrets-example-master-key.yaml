# k3s-gitops/ansible/roles/argocd_bootstrap/files/sealed-secrets-master-key.yaml
#
# =============================================================================
# SEALED SECRETS CONTROLLER MASTER KEY — READ BEFORE USING THIS FILE
# =============================================================================
#
# PURPOSE:
#   This file must contain the active TLS key pair used by the Sealed Secrets
#   controller so that sealed secrets in this repository can be decrypted after
#   any cluster rebuild. Without it, every SealedSecret must be re-sealed.
#
# HOW TO EXPORT THE KEY FROM A RUNNING CLUSTER:
#
#   kubectl get secret \
#     -n sealed-secrets \
#     -l sealedsecrets.bitnami.com/sealed-secrets-key=active \
#     -o yaml \
#   > ansible/roles/argocd_bootstrap/files/sealed-secrets-master-key.yaml
#
# The exported file will look like this (values truncated for illustration):
#
#   apiVersion: v1
#   kind: SecretList
#   items:
#     - apiVersion: v1
#       kind: Secret
#       metadata:
#         name: sealed-secrets-key<random-suffix>
#         namespace: sealed-secrets
#         labels:
#           sealedsecrets.bitnami.com/sealed-secrets-key: active
#       type: kubernetes.io/tls
#       data:
#         tls.crt: <base64-encoded-certificate>
#         tls.key: <base64-encoded-private-key>
#
# SECURITY REQUIREMENTS:
#   - NEVER commit this file to git with real key material inside.
#   - This file is referenced in .gitignore (add it if not already present).
#   - Store the real file encrypted in at least two offline locations:
#       1. An encrypted password manager (e.g., Bitwarden, 1Password)
#       2. A printed hard copy in a fireproof safe or safe-deposit box
#   - See docs/sealed-secrets-backup.md for the full backup strategy.
#
# RESTORE PROCEDURE:
#   1. Place your backed-up file at this path.
#   2. Run: ansible-playbook restore.yaml
#      The role applies it to the cluster before ArgoCD starts syncing.
#   3. ArgoCD will sync all SealedSecrets and they will decrypt correctly.
#   4. Delete this file from disk after the restore is confirmed working.
#
# DO NOT REPLACE THIS COMMENT WITH REAL KEY MATERIAL IN THE REPO.
# =============================================================================