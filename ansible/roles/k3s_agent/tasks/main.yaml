# k3s-gitops/ansible/roles/k3s_agent/tasks/main.yaml
# ---
- name: Check if K3s binary already exists on agent
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Retrieve node token from control plane facts
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}"
    k3s_server_url: "https://{{ k3s_master_ip }}:6443"

- name: Download K3s installer script on agent
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Install K3s agent
  ansible.builtin.shell:
    cmd: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: "agent"
  when: not k3s_binary.stat.exists

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
