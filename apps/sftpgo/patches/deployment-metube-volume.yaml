# apps/sftpgo/patches/deployment-metube-volume.yaml
# Strategic merge patch — assumes Deployment named "sftpgo", container named "sftpgo".
# ⚠️ Verify both names against your actual SFTPGo manifests before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftpgo     # ⚠️ adjust if your deployment name differs
  namespace: sftpgo
spec:
  template:
    spec:
      containers:
        - name: sftpgo   # ⚠️ adjust if your container name differs
          volumeMounts:
            - name: metube-downloads
              mountPath: /data/metube
      volumes:
        - name: metube-downloads
          persistentVolumeClaim:
            claimName: metube-downloads