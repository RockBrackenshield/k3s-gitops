# apps/sftpgo/values.yaml
fullnameOverride: sftpgo

sftpd:
  enabled: true
  port: 2022

webdavd:
  enabled: true
  port: 8081

httpd:
  enabled: true
  port: 8080

ftpd:
  enabled: false

env:
  SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
  SFTPGO_WEBDAVD__BINDINGS__0__PREFIX: /dav

envFrom:
  - secretRef:
      name: sftpgo-admin-credentials

podSecurityContext:
  fsGroup: 3000                       # must match the fsGroup you add to Jellyfin's Deployment (step 6)
  fsGroupChangePolicy: OnRootMismatch # skip a full recursive chown of the media library on every restart

persistence:
  enabled: true                       # backs /var/lib/sftpgo: sqlite db + SSH host keys
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
    storageClassName: longhorn        # confirm your actual StorageClass name

volumes:
  - name: jellyfin-media
    persistentVolumeClaim:
      claimName: jellyfin-media       # the RWX PVC from step 5

volumeMounts:
  - name: jellyfin-media
    mountPath: /mnt/jellyfin-media

volumes:
  - name: metube-downloads
    persistentVolumeClaim:
      claimName: metube-downloads

volumeMounts:
  - name: metube-downloads
    mountPath: /mnt/metube-downloads


service:
  type: ClusterIP
  services:
    sftp-external:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.7.203   # confirm this IP is unused in your pool
      ports:
        sftp:
          port: 22

ui:
  ingress:
    enabled: false   # using a Traefik IngressRoute instead, see step 4
api:
  ingress:
    enabled: false