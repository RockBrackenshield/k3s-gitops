# apps/sftpgo/resources/sealed-sftpgo-admin-secret.yaml.example
#
# Seal each key with:
#   printf '%s' 'admin' > /tmp/u && printf '%s' "$(openssl rand -base64 24)" > /tmp/p
#   kubeseal --raw --scope namespace-wide --namespace sftpgo --name sftpgo-admin-credentials --from-file=/tmp/u
#   kubeseal --raw --scope namespace-wide --namespace sftpgo --name sftpgo-admin-credentials --from-file=/tmp/p
#   rm /tmp/u /tmp/p
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sftpgo-admin-credentials
  namespace: sftpgo
spec:
  encryptedData:
    SFTPGO_DEFAULT_ADMIN_USERNAME: 
    SFTPGO_DEFAULT_ADMIN_PASSWORD: 
  template:
    metadata:
      name: sftpgo-admin-credentials
      namespace: sftpgo
    type: Opaque