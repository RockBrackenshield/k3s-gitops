# k3s-gitops/apps/jellyfin/base/ingressroute.yaml
# ---
# Exposes Jellyfin at https://jellyfin.hermnet.org.
# Requires wildcard-hermnet-org-tls to be reflected into the jellyfin namespace
# by Reflector (configured via wildcard-cert.yaml secretTemplate).
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin.hermnet.org`)
      priority: 10
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: wildcard-hermnet-org-tls
