# apps/home-assistant/ingressroute.yaml
#
# API group: traefik.io/v1alpha1 = Traefik v3
# If you're on Traefik v2, change to: traefik.containo.us/v1alpha1
#
# hermnet-wildcard-tls must match the secretName in your cert-manager
# Certificate resource for *.hermnet.org. Reflector should auto-mirror it
# to home-assistant when the namespace is created, per your existing config.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.hermnet.org`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
  tls:
    secretName: hermnet-wildcard-tls