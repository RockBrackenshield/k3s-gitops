# apps/home-assistant/ingressroute.yaml
#
# API group: traefik.io/v1alpha1 = Traefik v3
# If you're on Traefik v2, change to: traefik.containo.us/v1alpha1
#
# wildcard-hermnet-org-tls is the secretName of the cert-manager Certificate
# infrastructure/cert-manager/wildcard-cert.yaml; Reflector mirrors it into
# home-assistant (listed in its reflection namespaces).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.hermnet.org`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
  tls:
    secretName: wildcard-hermnet-org-tls