# apps/home-assistant/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  # Recreate is required: the RWO PVC can only be attached to one node at a
  # time. RollingUpdate would attempt to start the new pod before the old one
  # terminates, blocking the PVC attachment on any node change.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      # Graceful shutdown — HA can take time to cleanly close integrations.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/configuration.yaml ]; then
                echo "First boot detected — seeding configuration.yaml"
                cp /init-config/configuration.yaml /config/configuration.yaml
                echo "Done"
              else
                echo "configuration.yaml already present — skipping seed"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: init-config
              mountPath: /init-config
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: home-assistant
          # Renovate will manage updates via the kubernetes manager.
          # Update this to the current stable release before first deploy.
          image: ghcr.io/home-assistant/home-assistant:2026.3.4
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # startupProbe allows up to ~3.5 minutes for HA to finish loading
          # integrations before liveness takes over. Adjust failureThreshold
          # upward if you add many heavy integrations.
          startupProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: init-config
          configMap:
            name: home-assistant-init-config