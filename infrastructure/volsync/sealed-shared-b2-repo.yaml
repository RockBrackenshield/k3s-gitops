# k3s-gitops/infrastructure/volsync/sealed-shared-b2-repo.yaml
#
# -------------------------------------------------------------------
# GENERATION COMMAND:
#
#   kubectl create secret generic shared-b2-repo \
#     --namespace volsync-system \
#     --from-literal=RESTIC_REPOSITORY=s3:https://s3.us-east-005.backblazeb2.com/hermnet-restic-private \
#     --from-literal=RESTIC_PASSWORD=YOUR_RESTIC_PASSWORD \
#     --from-literal=AWS_ACCESS_KEY_ID=YOUR_B2_KEY_ID \
#     --from-literal=AWS_SECRET_ACCESS_KEY=YOUR_B2_APPLICATION_KEY \
#     --dry-run=client -o yaml \
#   | kubeseal \
#     --cert /tmp/sealed-secrets-pub.pem --format yaml \
#     --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets \
#   > infrastructure/volsync/sealed-shared-b2-repo.yaml
#
# RESTIC_REPOSITORY uses the bucket root — no sub-path suffix.
# VolSync tags every snapshot with the source PVC name and namespace,
# so AdGuard, Jellyfin, and any future app coexist in one repository
# without conflict. Reflector mirrors this secret to every namespace
# listed in reflection-auto-namespaces.
#
# When adding a new application that needs VolSync backup:
#   1. Add its namespace to reflection-allowed-namespaces and
#      reflection-auto-namespaces in template.metadata.annotations below.
#   2. Commit and push — ArgoCD and Reflector handle the rest.
# -------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: shared-b2-repo
  namespace: volsync-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
    RESTIC_PASSWORD: 
    RESTIC_REPOSITORY: 
  template:
    metadata:
      name: shared-b2-repo
      namespace: volsync-system
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "adguard,jellyfin,monitoring"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "adguard,jellyfin,monitoring"
    type: Opaque