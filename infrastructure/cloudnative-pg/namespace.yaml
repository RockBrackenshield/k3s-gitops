apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
  annotations:
    # This dir is now synced as a *third* source on the operator Application
    # (bootstrap/infrastructure/cloudnative-pg-operator.yaml) alongside the
    # Helm chart source — give the namespace an explicit early resource-wave
    # so it's guaranteed to land before the b2-credentials secret below.
    argocd.argoproj.io/sync-wave: "0"
