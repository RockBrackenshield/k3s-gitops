# LB IPAM pool (replaces MetalLB). Services request a fixed address with the
# lbipam.cilium.io/ips annotation; everything else gets the next free one.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: infrastructure-pool
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: "192.168.7.200"
      stop: "192.168.7.220"
