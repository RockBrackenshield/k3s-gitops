# Hubble UI at https://hubble.hermnet.org behind authentik forward-auth.
# Needs wildcard-hermnet-org-tls reflected into kube-system (wildcard-cert.yaml)
# and Traefik allowCrossNamespace (authentik middleware lives in authentik).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`hubble.hermnet.org`)
      middlewares:
        - name: authentik-forwardauth
          namespace: authentik
      services:
        - name: hubble-ui
          port: 80
  tls:
    secretName: wildcard-hermnet-org-tls
