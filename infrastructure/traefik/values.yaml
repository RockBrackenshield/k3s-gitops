# k3s-gitops/infrastructure/traefik/values.yaml
# ---
# Values for the traefik/traefik chart 42.1.3 (Traefik v3.7.16), deployed by
# bootstrap/apps/traefik.yaml into the traefik namespace (PSA restricted).
# Replaces the k3s-bundled Traefik + HelmChartConfig.
image:
  registry: docker.io
  repository: traefik
  # tag@digest: the digest is what the kubelet verifies; the tag feeds the
  # chart's version checks. Renovate updates both.
  tag: v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2

deployment:
  replicas: 1
  additionalVolumes:
    # Dynamic file-provider config for external-services (unifi, dockhand).
    # The ConfigMap is owned by the external-services app (sync wave 10);
    # optional so Traefik can start before it exists.
    - name: external-services-config
      configMap:
        name: traefik-external-services
        optional: true
additionalVolumeMounts:
  - name: external-services-config
    mountPath: /config/dynamic
    readOnly: true

# Pinned: the Service uses externalTrafficPolicy Local and is announced only
# from k3s-master (pinned-k3s-master CiliumL2AnnouncementPolicy). UNTESTED.
nodeSelector:
  kubernetes.io/hostname: k3s-master

service:
  labels:
    l2.hermnet.org/pin: k3s-master
  annotations:
    lbipam.cilium.io/ips: "192.168.7.205"
  spec:
    externalTrafficPolicy: Local

providers:
  kubernetesCRD:
    # IngressRoutes in one namespace (e.g. longhorn-system) reference the
    # authentik forward-auth Middleware in the authentik namespace.
    allowCrossNamespace: true
  # Still needed: zot uses a networking.k8s.io Ingress (className traefik).
  kubernetesIngress:
    enabled: true
  # The chart's file provider only supports inline content; the directory
  # provider below reads the mounted ConfigMap instead.
  file:
    enabled: false
additionalArguments:
  - "--providers.file.directory=/config/dynamic"
  - "--providers.file.watch=true"

ports:
  web:
    # Trust X-Forwarded-* only from in-cluster sources (pod 10.42/16,
    # service 10.43/16 - talos/patches/common.yaml).
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, 10.42.0.0/16, 10.43.0.0/16]
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, 10.42.0.0/16, 10.43.0.0/16]
  # DNS over TCP/UDP for AdGuard (infrastructure/adguard/ingressroute-tcp.yaml).
  dns-tcp:
    port: 9053
    expose:
      default: true
    exposedPort: 53
    protocol: TCP
  dns-udp:
    port: 9054
    expose:
      default: true
    exposedPort: 53
    protocol: UDP

ingressRoute:
  dashboard:
    # A custom api@internal IngressRoute behind authentik comes later.
    enabled: false

log:
  level: INFO
accessLog:
  enabled: true
  format: json   # simpler Loki/Promtail parsing
