# external-services/_shared/traefik-dynamic-config.yaml
# Mounted into the Traefik pod at /config/dynamic (infrastructure/traefik/
# values.yaml), so it must live in Traefik's namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-external-services
  namespace: traefik
data:
  dynamic.yaml: |
    http:
      routers:
        unifi:
          rule: "Host(`unifi.hermnet.org`)"
          entryPoints: ["websecure"]
          service: unifi
          tls: {}
        dockhand:
          rule: "Host(`dockhand.hermnet.org`)"
          entryPoints: ["websecure"]
          service: dockhand
          tls: {}
      services:
        unifi:
          loadBalancer:
            servers:
              - url: "https://192.168.1.1:443"
            serversTransport: external-services-skip-tls-verify@kubernetescrd  # ServersTransport external-services/skip-tls-verify
        dockhand:
          loadBalancer:
            servers:
              - url: "http://192.168.7.11:3000"