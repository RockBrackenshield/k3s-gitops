# k3s-gitops/infrastructure/external-services/unifi/ingressroute.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: external-services
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.hermnet.org`)
      kind: Rule
      services:
        - name: unifi
          port: 443
          scheme: https                # Tell Traefik the upstream speaks HTTPS
          serversTransport: skip-tls-verify
  tls:
    secretName: hermnet-wildcard-tls  # Your wildcard cert — see note below