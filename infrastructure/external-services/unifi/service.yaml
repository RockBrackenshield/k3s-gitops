# k3s-gitops/infrastructure/external-services/unifi/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: external-services
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  # No selector — Kubernetes won't auto-manage endpoints.
  # The companion Endpoints object below provides the real target IP.
---
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi        # Must exactly match the Service name above.
  namespace: external-services
subsets:
  - addresses:
      - ip: 192.168.1.1
    ports:
      - name: https
        port: 443
        protocol: TCP