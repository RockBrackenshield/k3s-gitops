# k3s-gitops/infrastructure/adguard/service-dns.yaml
# ---
# Dedicated LoadBalancer service for DNS traffic at the reserved IP 192.168.7.202.
# Configure your router's DNS server to point at 192.168.7.202.
# The IP is pinned via the Cilium LB IPAM annotation. externalTrafficPolicy
# Local is only valid while the pod is pinned to k3s-master (deployment.yaml
# nodeSelector); the l2.hermnet.org/pin label makes only k3s-master announce
# it (infrastructure/cilium/l2-policy.yaml, pinned-k3s-master). UNTESTED.
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    lbipam.cilium.io/ips: "192.168.7.202"
  labels:
    app: adguard
    app.kubernetes.io/name: adguard-home
    l2.hermnet.org/pin: k3s-master   # selected by the pinned-k3s-master L2 policy
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: adguard
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
