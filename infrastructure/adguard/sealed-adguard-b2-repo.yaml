# k3s-gitops/infrastructure/adguard/sealed-adguard-b2-repo.yaml
#
# -------------------------------------------------------------------
# GENERATION COMMAND:
#
#   kubectl create secret generic adguard-b2-repo \
#     --namespace adguard \
#     --from-literal=RESTIC_REPOSITORY=s3:https://s3.us-east-005.backblazeb2.com/hermnet-restic-private/adguard \
#     --from-literal=RESTIC_PASSWORD=YOUR_RESTIC_REPOSITORY_PASSWORD \
#     --from-literal=AWS_ACCESS_KEY_ID=YOUR_B2_KEY_ID \
#     --from-literal=AWS_SECRET_ACCESS_KEY=YOUR_B2_APPLICATION_KEY \
#     --dry-run=client -o yaml \
#   | kubeseal \
#     --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets \
#     --format yaml \
#   > infrastructure/adguard/sealed-adguard-b2-repo.yaml
#
# YOUR_RESTIC_REPOSITORY_PASSWORD is a strong passphrase you choose (store it
# in your password manager alongside the sealed-secrets master key).
# YOUR_B2_KEY_ID and YOUR_B2_APPLICATION_KEY come from the Backblaze B2
# application key scoped to the hermnet-restic-private bucket.
# -------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: adguard-b2-repo
  namespace: adguard
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    RESTIC_REPOSITORY: SEALED_SECRET_PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    RESTIC_PASSWORD: SEALED_SECRET_PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    AWS_ACCESS_KEY_ID: SEALED_SECRET_PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    AWS_SECRET_ACCESS_KEY: SEALED_SECRET_PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: adguard-b2-repo
      namespace: adguard
    type: Opaque
