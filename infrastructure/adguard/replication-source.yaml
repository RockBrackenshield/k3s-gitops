# k3s-gitops/infrastructure/adguard/replication-source.yaml
# ---
# VolSync ReplicationSource — backs up the adguard-config PVC to Backblaze B2
# daily at 02:00 using restic. copyMethod: Snapshot requires Longhorn's
# CSI snapshot support (VolumeSnapshotClass: longhorn).
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: adguard-config-backup
  namespace: adguard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: adguard-config
  trigger:
    schedule: "45 2 * * *"
  restic:
    pruneIntervalDays: 7
    repository: shared-b2-repo
    retain:
      hourly: 6
      daily: 7
      weekly: 4
      monthly: 3
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn
    storageClassName: longhorn-usb-eph
    accessModes:
      - ReadWriteOnce
    cacheStorageClassName: longhorn-usb-eph
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 1Gi
