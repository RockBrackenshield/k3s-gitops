# k3s-gitops/infrastructure/adguard/ingressroute.yaml
# ---
# Exposes the AdGuard Home web UI at https://adguard.hermnet.org.
# Requires wildcard-hermnet-org-tls to be reflected into the adguard namespace.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-ui
  namespace: adguard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`adguard.hermnet.org`)
      priority: 10
      services:
        - name: adguard-http
          port: 80
  tls:
    secretName: wildcard-hermnet-org-tls
