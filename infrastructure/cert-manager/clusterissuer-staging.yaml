# k3s-gitops/infrastructure/cert-manager/clusterissuer-staging.yaml
# ---
# Let's Encrypt staging issuer — use this for testing to avoid rate limits.
# Switch wildcard-cert.yaml to reference letsencrypt-staging when testing.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    email: admin@hermnet.org
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            email: admin@hermnet.org
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
