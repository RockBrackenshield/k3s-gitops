# k3s-gitops/infrastructure/cert-manager/clusterissuer-prod.yaml
# ---
# Let's Encrypt production issuer — used by wildcard-cert.yaml for real certs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    email: admin@hermnet.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            email: admin@hermnet.org
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
