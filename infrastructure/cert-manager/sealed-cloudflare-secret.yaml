# k3s-gitops/infrastructure/cert-manager/sealed-cloudflare-secret.yaml
#
# -------------------------------------------------------------------
# GENERATION COMMAND:
#
#   kubectl create secret generic cloudflare-api-token \
#     --namespace cert-manager \
#     --from-literal=api-token=YOUR_CLOUDFLARE_API_TOKEN \
#     --dry-run=client -o yaml \
#   | kubeseal \
#     --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets \
#     --format yaml \
#   > infrastructure/cert-manager/sealed-cloudflare-secret.yaml
#
# Replace YOUR_CLOUDFLARE_API_TOKEN with a Cloudflare API token scoped to:
#   Zone → DNS → Edit  (for hermnet.org zone only)
# -------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
