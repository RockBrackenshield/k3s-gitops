# k3s-gitops/infrastructure/renovate/sealed-github-token-secret.yaml
#
# -------------------------------------------------------------------
# STEP 1 — Create a GitHub Personal Access Token
#
# Go to: https://github.com/settings/personal-access-tokens/new
# Token type: Fine-grained personal access token (recommended over classic)
#
# Settings:
#   Resource owner:  RockBrackenshield
#   Repository access: Only select repositories → k3s-gitops
#   Repository permissions:
#     Contents:       Read and write   (clone repo, read files)
#     Pull requests:  Read and write   (open and update PRs)
#     Metadata:       Read-only        (required baseline)
#
# If using a classic PAT instead, the required scope is: repo (full)
#
# STEP 2 — Seal the token
#
#   kubectl create secret generic renovate-github-token \
#     --namespace renovate \
#     --from-literal=token=YOUR_GITHUB_FINE_GRAINED_PAT \
#     --dry-run=client -o yaml \
#   | kubeseal --cert /tmp/sealed-secrets-pub.pem --format yaml \
#   > infrastructure/renovate/sealed-github-token-secret.yaml
#
# STEP 3 — Store the raw PAT offline
#
# Save the plain PAT in your password manager alongside the Sealed
# Secrets master key. If the cluster is rebuilt you will need to
# re-seal it. The PAT itself has no expiry unless you set one; set
# an expiry of 1 year and calendar a reminder to rotate it.
#
# CODEBERG MIGRATION: replace this secret with a Codeberg application
# token. Generate one at https://codeberg.org/user/settings/applications
# and re-seal using the same command above with the new token value.
# -------------------------------------------------------------------
# ---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: renovate-github-token
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: renovate-github-token
      namespace: renovate
    type: Opaque