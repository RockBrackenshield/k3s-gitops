# k3s-gitops/infrastructure/renovate/configmap.yaml
# ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.js: |
    module.exports = {
      // ── Platform ───────────────────────────────────────────────────────────
      // GitHub, authenticated via the renovate-github-token Secret.
      //
      // CODEBERG MIGRATION: switch to:
      //   platform: 'gitea',
      //   endpoint: 'https://codeberg.org',
      // Codeberg runs Forgejo which is fully compatible with Renovate's
      // Gitea platform driver. The token in the SealedSecret must also
      // be replaced with a Codeberg application token (see sealed secret
      // file for generation instructions).
      platform: 'github',
      token: process.env.RENOVATE_TOKEN,

      // ── Repository ─────────────────────────────────────────────────────────
      repositories: ['RockBrackenshield/k3s-gitops'],

      // ── Identity ───────────────────────────────────────────────────────────
      gitAuthor: 'Renovate[bot] <renovate@hermnet.org>',

      // ── Onboarding ─────────────────────────────────────────────────────────
      // Config is provided via this ConfigMap — suppress the onboarding PR.
      onboarding: false,
      requireConfig: 'optional',

      // ── Schedule ───────────────────────────────────────────────────────────
      // The CronJob controls timing (02:00 daily). Renovate's internal
      // schedule is left open so it never suppresses PRs when it runs.
      schedule: ['at any time'],

      // ── Merge policy ───────────────────────────────────────────────────────
      // Every PR requires manual review and merge. Nothing auto-merges.
      automerge: false,

      // ── Managers ───────────────────────────────────────────────────────────
      // argocd         — Application sources in bootstrap/: Helm charts
      //                  (cilium, traefik, longhorn, sealed-secrets, ...) and
      //                  git tags (gateway-api v1.6.3, traefik CRDs v42.1.3,
      //                  external-snapshotter). Needs managerFilePatterns.
      // dockerfile     — Base images in any Dockerfiles added in future
      // flux           — Flux HelmRelease chart versions and GitRepository tags
      //                  under flux/ and clusters/ (the Argo CD `argocd`
      //                  manager is removed in the Argo cleanup PR).
      // github-actions — SHA-pinned actions in .github/workflows (digest + tag comment)
      // kubernetes     — Container image tags in Deployment and CronJob resources
      //                  (adguard, jellyfin, etcd-backup, renovate itself)
      // kustomize      — Image overrides in kustomization.yaml files
      //                  (bootstrap/argocd tag@digest, jellyfin overlays)
      enabledManagers: [
        'argocd',
        'custom.regex',
        'dockerfile',
        'flux',
        'github-actions',
        'kubernetes',
        'kustomize',
      ],
      argocd: {
        managerFilePatterns: ['/^bootstrap/.+\\.ya?ml$/'],
      },
      flux: {
        managerFilePatterns: ['/^flux/.+\\.ya?ml$/', '/^clusters/.+\\.ya?ml$/'],
      },
      kubernetes: {
        managerFilePatterns: ['/^(apps|infrastructure)/.+\\.ya?ml$/'],
      },

      // ── Custom managers ────────────────────────────────────────────────────
      customManagers: [
        // talos/versions.env - every pin is preceded by
        //   # renovate: datasource=<ds> depName=<dep> [registryUrl=<url>]
        // Bumping TALOS_VERSION or CILIUM_VERSION alone makes CI fail on
        // purpose (scripts/check-versions.sh): the talosctl checksums,
        // installer digests (`make -C talos images`) and CILIUM_CHART_SHA256
        // must be updated in the same PR by a human.
        {
          customType: 'regex',
          managerFilePatterns: ['/^talos/versions\\.env$/'],
          matchStrings: [
            '#\\s*renovate:\\s*datasource=(?<datasource>\\S+)\\s+depName=(?<depName>\\S+)(?:\\s+registryUrl=(?<registryUrl>\\S+))?\\n[A-Z0-9_]+=(?<currentValue>\\S+)',
          ],
        },

        // Argo CD install manifest ref (raw URL, not understood by the
        // kustomize manager). Bump the image digests below it together.
        {
          customType: 'regex',
          managerFilePatterns: ['/^bootstrap/argocd/kustomization\\.yaml$/'],
          matchStrings: [
            'argoproj/argo-cd/(?<currentValue>v[\\d.]+)/manifests/install\\.yaml',
          ],
          datasourceTemplate: 'github-releases',
          depNameTemplate: 'argoproj/argo-cd',
        },

        // Traefik image (tag@digest) in the chart values.
        {
          customType: 'regex',
          managerFilePatterns: ['/^infrastructure/traefik/values\\.yaml$/'],
          matchStrings: [
            'repository:\\s*traefik\\n\\s+tag:\\s*(?<currentValue>[^@\\s]+)@(?<currentDigest>sha256:[a-f0-9]{64})',
          ],
          datasourceTemplate: 'docker',
          depNameTemplate: 'docker.io/library/traefik',
        },

        // Volume Snapshotter CRDs
        {
          customType: 'regex',
          managerFilePatterns: ['/^bootstrap/crds/kustomization\\.yaml$/'],
          matchStrings: [
            'external-snapshotter/(?<currentValue>v[\\d.]+)/client',
          ],
          datasourceTemplate: 'github-releases',
          depNameTemplate: 'kubernetes-csi/external-snapshotter',
        },

        // Flux version. REVIEWED PRs only (see the packageRule below). The
        // upstream install.yaml carries no version string and must stay
        // byte-for-byte (its sha256 is CI-checked), so the version is read from
        // a `# Flux Version: vX.Y.Z` comment line in
        // .github/flux-install.sha256 (or a header in gotk-components.yaml if
        // one is ever added). A Flux bump also changes the controller image
        // digests in clusters/homelab/flux-system/kustomization.yaml by hand.
        {
          customType: 'regex',
          managerFilePatterns: [
            '/^clusters/homelab/flux-system/gotk-components\\.yaml$/',
            '/^\\.github/flux-install\\.sha256$/',
          ],
          matchStrings: [
            '#\\s*Flux Version:\\s*(?<currentValue>v\\d+\\.\\d+\\.\\d+)',
          ],
          datasourceTemplate: 'github-releases',
          depNameTemplate: 'fluxcd/flux2',
        },
      ],

      // ── Package rules ──────────────────────────────────────────────────────
      packageRules: [
        // Minimum 3-day release age before a PR is raised. Protects against
        // yanked releases and gives upstream ecosystems time to publish
        // compatible tooling before this cluster consumes a new version.
        {
          matchPackageNames: ['*'],
          minimumReleaseAge: '3 days',
        },

        // Kubernetes: 1.36.x patches only (Cilium 1.20 tests 1.33-1.36).
        // Tags are vX.Y.Z; versions.env stores X.Y.Z.
        {
          matchPackageNames: ['kubernetes/kubernetes'],
          extractVersion: '^v(?<version>.+)$',
          allowedVersions: '<1.37.0',
        },

        // Cilium is pinned in talos/versions.env AND bootstrap/apps/cilium.yaml;
        // Talos lives in versions.env + the installer refs. Keep each in its
        // own PR so the manual follow-ups (checksums, digests) are obvious.
        {
          matchPackageNames: ['cilium'],
          groupName: 'cilium',
        },
        {
          matchPackageNames: ['siderolabs/talos'],
          groupName: 'talos',
        },

        // Patch and minor updates are grouped into a single PR per run to
        // reduce noise. Still requires manual review and merge.
        {
          matchUpdateTypes: ['patch', 'minor'],
          groupName: 'all non-major updates',
          automerge: false,
        },

        // Flux itself: its own PR, never merged automatically, and a reminder
        // that Flux cannot roll back its own upgrade.
        {
          matchPackageNames: ['fluxcd/flux2'],
          groupName: 'flux',
          automerge: false,
          prBodyNotes: [
            "Flux self-upgrade: after merge, run the self-upgrade health check; a Flux upgrade can't roll itself back.",
          ],
        },

        // Flux HelmRelease chart bumps: charts with `upgrade.crds: Skip` do
        // not upgrade their CRDs.
        {
          matchManagers: ['flux'],
          matchDatasources: ['helm', 'docker'],
          prBodyNotes: [
            "Check whether this chart's `crds/` changed; if so, set `upgrade.crds: CreateReplace` for this upgrade.",
          ],
        },

        // Major updates always produce individual PRs for deliberate review.
        // Breaking changes should never be hidden inside a bulk update.
        {
          matchUpdateTypes: ['major'],
          automerge: false,
        },
      ],
    };