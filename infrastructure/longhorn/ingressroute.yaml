# k3s-gitops/infrastructure/longhorn/ingressroute.yaml
# ---
# Exposes the Longhorn UI at https://longhorn.hermnet.org via Traefik.
# Requires wildcard-hermnet-org-tls to be reflected into longhorn-system
# by Reflector (configured in wildcard-cert.yaml secretTemplate).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn.hermnet.org`)
      priority: 10
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: wildcard-hermnet-org-tls
