# k3s-gitops/infrastructure/longhorn/namespace.yaml
# ---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    # Talos enforces PSA baseline by default; Longhorn manager/instance-manager
    # pods are privileged (iSCSI, host mounts under /var/mnt/longhorn).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    app.kubernetes.io/name: longhorn
