# k3s-gitops/infrastructure/zot/sealedsecret-htpasswd.yaml
#
# TEMPLATE — do not commit as-is. Generate the real SealedSecret like this:
#
#   htpasswd -Bbn admin '<password>' > /tmp/zot.htpasswd
#   # append more users the same way if needed:
#   # htpasswd -Bbn readonly '<password>' >> /tmp/zot.htpasswd
#
#   kubectl create secret generic zot-secret \
#     --namespace zot \
#     --from-file=htpasswd=/tmp/zot.htpasswd \
#     --dry-run=client -o yaml > /tmp/zot-secret.yaml
#
#   kubeseal --format yaml \
#     --cert /path/to/sealed-secrets-public-cert.pem \
#     < /tmp/zot-secret.yaml > infrastructure/zot/sealedsecret-htpasswd.yaml
#
#   printf '%s' "$(rm -f /tmp/zot.htpasswd /tmp/zot-secret.yaml)"   # clean up plaintext
#
# The chart mounts this at /secret because values.yaml sets `mountSecret: true`
# with empty `secretFiles`, which expects an externally managed Secret named
# "<release-name>-secret" — "zot-secret" for release "zot".
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zot-secret
  namespace: zot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: zot
    app.kubernetes.io/name: zot-secret
spec:
  encryptedData:
    htpasswd: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: zot-secret
      namespace: zot
      labels:
        app: zot
        app.kubernetes.io/name: zot-secret
    type: Opaque
