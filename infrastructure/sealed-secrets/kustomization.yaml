# k3s-gitops/infrastructure/sealed-secrets/kustomization.yaml
# The Helm chart itself is sourced directly from the ArgoCD Application in
# bootstrap/apps/sealed-secrets.yaml. This kustomization declares the namespace
# as a supplementary resource applied alongside the Helm release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
