# infrastructure/authentik/secret-authentik.yaml.example
#
# AUTHENTIK_SECRET_KEY:      openssl rand -base64 60 | tr -d '\n'
# AUTHENTIK_BOOTSTRAP_PASSWORD: openssl rand -base64 24 | tr -d '\n'
# AUTHENTIK_BOOTSTRAP_TOKEN:    openssl rand -base64 32 | tr -d '\n'
#
# Seal with:
#   kubeseal --format=yaml --controller-namespace kube-system \
#     < infrastructure/authentik/secret-authentik.yaml.example \
#     > infrastructure/authentik/sealed-secret-authentik.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-config
  namespace: authentik
spec:
  encryptedData:
    AUTHENTIK_BOOTSTRAP_EMAIL: 
    AUTHENTIK_BOOTSTRAP_PASSWORD: 
    AUTHENTIK_BOOTSTRAP_TOKEN: 
    AUTHENTIK_SECRET_KEY: 
  template:
    metadata:
      name: authentik-config
      namespace: authentik
    type: Opaque