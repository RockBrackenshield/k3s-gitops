# infrastructure/authentik/postgresql/secret.yaml.example
#
# Generate a strong password:
#   openssl rand -base64 32 | tr -d '\n'
#
# Seal it:
#   kubeseal --format=yaml --controller-namespace kube-system \
#     < infrastructure/authentik/postgresql/secret.yaml.example \
#     > infrastructure/authentik/postgresql/sealed-secret.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-postgresql-credentials
  namespace: authentik
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: authentik-postgresql-credentials
      namespace: authentik
    type: Opaque