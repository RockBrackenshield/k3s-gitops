# infrastructure/authentik/server/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-server
    app.kubernetes.io/part-of: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-server
      app.kubernetes.io/part-of: authentik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-server
        app.kubernetes.io/part-of: authentik
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.2.4 # verify tag; Renovate manages updates after
          args: ["server"]
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
          envFrom:
            - secretRef:
                name: authentik-config
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-postgresql
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: "false"
            - name: AUTHENTIK_DISABLE_UPDATE_CHECK
              value: "true"
            - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
              value: "true"
            - name: AUTHENTIK_AVATARS
              value: "initials"
          volumeMounts:
            - name: media
              mountPath: /media
            - name: blueprints-custom
              mountPath: /blueprints/custom
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 30
      volumes:
        - name: media
          emptyDir: {} # non-persistent; fine while using initials-only avatars and
                        # no uploaded custom branding/icons. Revisit with a PVC if that changes.
        - name: blueprints-custom
          configMap:
            name: authentik-blueprints-custom