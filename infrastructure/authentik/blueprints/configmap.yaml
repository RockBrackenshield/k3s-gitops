# infrastructure/authentik/blueprints/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-custom
  namespace: authentik
data:
  hermnet-core.yaml: |
    version: 1
    metadata:
      name: hermnet-core
    entries:
      - model: authentik_core.group
        id: group-infra-admins
        identifiers:
          name: Infrastructure Admins
        attrs:
          is_superuser: false

      - model: authentik_providers_proxy.proxyprovider
        id: provider-forwardauth-domain
        identifiers:
          name: forwardauth-hermnet
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          external_host: https://hermnet.org
          cookie_domain: hermnet.org

      - model: authentik_core.application
        id: app-longhorn
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !KeyOf provider-forwardauth-domain
          meta_launch_url: https://longhorn.hermnet.org/
          meta_description: Cluster storage management (Longhorn)
          open_in_new_tab: true