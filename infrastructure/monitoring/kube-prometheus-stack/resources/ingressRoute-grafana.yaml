# Traefik IngressRoute for Grafana.
# No ForwardAuth middleware — Grafana handles authentication natively via
# Authentik OIDC (generic_oauth). Applying ForwardAuth here would double-prompt
# users and break the OAuth redirect flow.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.hermnet.org`)
      kind: Rule
      services:
        # Service name follows kube-prometheus-stack naming: <release-name>-grafana
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: hermnet-wildcard-tls