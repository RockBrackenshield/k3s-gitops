# Authentik OIDC credentials for Grafana's generic_oauth provider.
# These are injected into the Grafana container as environment variables via
# envFromSecret; grafana.ini references them as ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
# and ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}.
#
# PRE-REQUISITE — create the Authentik application first:
#   Authentik UI → Applications → Providers → Create
#     Type:            OAuth2/OpenID Connect
#     Name:            Grafana
#     Client type:     Confidential
#     Client ID:       grafana  (or accept the generated value)
#     Redirect URIs:   https://grafana.hermnet.org/login/generic_oauth
#     Scopes:          openid, profile, email
#   → Note the Client ID and Client Secret before sealing.
#
#   Then: Applications → Create
#     Name:     Grafana
#     Provider: (the provider you just created)
#     Slug:     grafana  (must match the URL slug in values.yaml auth_url/token_url)
#
#   Optionally create an Authentik Group named "Grafana Admins" and assign
#   it to users who should have the Admin role in Grafana. The role_attribute_path
#   in values.yaml checks for membership in exactly this group name.
#
# TO SEAL:
#   1. Create the plaintext Secret (do NOT commit this file):
#
#      cat <<EOF > /tmp/grafana-oidc-secret.yaml
#      apiVersion: v1
#      kind: Secret
#      metadata:
#        name: grafana-oidc
#        namespace: monitoring
#      stringData:
#        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: <CLIENT_ID_FROM_AUTHENTIK>
#        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: <CLIENT_SECRET_FROM_AUTHENTIK>
#      EOF
#
#   2. Seal it:
#      printf '' | kubeseal --format yaml \
#        --secret-file /tmp/grafana-oidc-secret.yaml \
#        > apps/monitoring/kube-prometheus-stack/resources/sealed-grafana-oidc-secret.yaml
#
#   3. Shred the plaintext:
#      shred -u /tmp/grafana-oidc-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  encryptedData:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: 
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: 
  template:
    metadata:
      name: grafana-oidc
      namespace: monitoring
