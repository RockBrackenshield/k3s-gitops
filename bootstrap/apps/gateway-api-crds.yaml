# k3s-gitops/bootstrap/apps/gateway-api-crds.yaml
# ---
# Gateway API v1.6.3 Standard-channel CRDs, owned only by Argo (same pattern as
# external-snapshotter-crds). Wave -4: before cilium (-3). Cilium's
# gatewayAPI.enabled stays false for now; Traefik uses its own traefik.io CRDs.
# No resources-finalizer: deleting this Application must never cascade-delete
# the CRDs (and with them every Gateway/Route).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    targetRevision: v1.6.3             # tag -> c0836133e24073fcdcdbb1713aba3cc73a89d0b5
    path: config/crd/standard
    directory:
      # Standard channel minus the CRDs Cilium 1.20 calls optional (not needed:
      # LAN DNS is CoreDNS lan-dns with its own LB Service; Traefik serves no
      # TCP/UDP routes).
      # Keeps: gatewayclasses, gateways, httproutes, grpcroutes,
      # referencegrants, backendtlspolicies, tlsroutes + vap_safeupgrades.
      exclude: '{*_listenersets.yaml,*_tcproutes.yaml,*_udproutes.yaml}'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false      # never prune CRDs - deletion cascades to every Gateway/Route
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # large CRD schemas
