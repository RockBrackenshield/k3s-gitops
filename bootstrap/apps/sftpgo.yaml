# bootstrap/apps/sftpgo.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sftpgo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/sftpgo/helm-charts
      chart: sftpgo
      targetRevision: "0.41.0"   # check for newer; Renovate will track this
      helm:
        valueFiles:
          - $values/apps/sftpgo/values.yaml
    - repoURL: https://github.com/RockBrackenshield/k3s-gitops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/RockBrackenshield/k3s-gitops
      targetRevision: main
      path: apps/sftpgo
  destination:
    server: https://kubernetes.default.svc
    namespace: sftpgo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true