apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5" # apps wave
spec:
  project: default
  source:
    repoURL: https://github.com/RockBrackenshield/k3s-gitops.git
    targetRevision: main
    path: apps/paperless/base
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
