apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-snapshotter-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-csi/external-snapshotter
    targetRevision: v8.2.0
    path: client/config/crd
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false      # never prune CRDs — deletion cascades to all VolumeSnapshot objects
      selfHeal: true
    syncOptions:
      - ServerSideApply=true  # CRD schemas exceed 262KB client-side annotation limit