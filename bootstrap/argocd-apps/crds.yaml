# bootstrap/argocd-apps/crds.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-snapshotter-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"  # before everything else
spec:
  project: default
  source:
    repoURL: https://github.com/RockBrackenshield/k3s-gitops
    targetRevision: HEAD
    path: bootstrap/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true