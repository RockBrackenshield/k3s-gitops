# Argo CD install, pinned. Applied once by `make bootstrap-argocd`
# (kubectl apply --server-side --force-conflicts -k bootstrap/argocd); after that
# Argo CD is upgraded by bumping the ref + digests here and re-running it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Tag v3.5.6 = commit c2b1e3017e2cec86b122172e861dcd026453ae44
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  # TLS terminates at Traefik (bootstrap/argocd-ingress.yaml).
  - target: {kind: ConfigMap, name: argocd-cmd-params-cm}
    patch: |-
      - op: add
        path: /data
        value: {server.insecure: "true"}
images:
  # Same tags as install.yaml v3.5.6, pinned to multi-arch index digests.
  - name: quay.io/argoproj/argocd
    newTag: v3.5.6@sha256:8e5cc5bb008df8a09dba439462e58c94c55b7735888d3ebde0c25fc05e4e5335
  - name: ghcr.io/dexidp/dex
    newTag: v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
  - name: public.ecr.aws/docker/library/redis
    newTag: 8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
