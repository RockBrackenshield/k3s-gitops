# bootstrap/infrastructure/tailscale-connector-app.yaml
#
# Deploys the Connector CRD resource (cluster-scoped).
# Must run after wave 2 so the Tailscale operator CRDs are installed
# and the operator is running and ready to reconcile Connector objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-connector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/RockBrackenshield/k3s-gitops.git
    targetRevision: HEAD
    path: infrastructure/tailscale-connector
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true