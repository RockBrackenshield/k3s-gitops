# bootstrap/infrastructure/cloudnative-pg.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0

    helm:
      releaseName: cloudnative-pg
      values: |
        # CloudNativePG manages PostgreSQL clusters throughout the
        # Kubernetes cluster.
        config:
          clusterWide: true

        # Install the CloudNativePG CRDs as part of this application.
        crds:
          create: true

        # Prometheus Operator is not assumed to be present.
        monitoring:
          podMonitorEnabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true