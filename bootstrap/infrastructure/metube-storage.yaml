# bootstrap/infrastructure/metube-storage.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metube-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # before MeTube app at wave 2
spec:
  project: default
  source:
    repoURL: https://github.com/RockBrackenshield/k3s-gitops.git
    targetRevision: HEAD
    path: infrastructure/storage/metube-downloads
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system   # covers the Volume CR; PVs are cluster-scoped and require no namespace
  syncPolicy:
    automated:
      prune: false   # storage infrastructure must never be auto-pruned
      selfHeal: true
    syncOptions:
      - CreateNamespace=false