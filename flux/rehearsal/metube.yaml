# Used only in the P6(b) metube dress rehearsal (kubectl apply -f). Never referenced by
# flux/cluster or clusters/homelab. Delete these objects after the rehearsal.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/RockBrackenshield/k3s-gitops
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metube
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./apps/metube
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
