# Overlay for the NEW cluster only (Flux Kustomization `cert-manager-config`).
# Base: infrastructure/cert-manager, unchanged; the old cluster's Argo CD keeps syncing it.
# Removes the SealedSecret (the new cluster has no SealedSecret CRD); the Secret comes from flux/secrets/cert-manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/cert-manager
patches:
  - target:
      kind: SealedSecret
      name: cloudflare-api-token
    patch: |
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: cloudflare-api-token
