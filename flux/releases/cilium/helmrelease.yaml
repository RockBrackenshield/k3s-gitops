apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  suspend: true
  chart:
    spec:
      chart: cilium
      version: "1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-values
