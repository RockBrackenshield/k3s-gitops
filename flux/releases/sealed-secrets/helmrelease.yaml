apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: sealed-secrets-controller
  targetNamespace: sealed-secrets
  storageNamespace: sealed-secrets
  chart:
    spec:
      chart: sealed-secrets
      version: "2.18.6"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: sealed-secrets-helm-values
