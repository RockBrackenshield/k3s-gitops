apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: volsync
  targetNamespace: volsync-system
  storageNamespace: volsync-system
  chart:
    spec:
      chart: volsync
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
