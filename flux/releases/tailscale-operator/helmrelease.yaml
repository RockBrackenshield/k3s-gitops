apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  storageNamespace: tailscale
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-operator-helm-values
