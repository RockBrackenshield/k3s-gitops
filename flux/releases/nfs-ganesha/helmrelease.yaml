apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-ganesha
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: nfs-ganesha
  targetNamespace: nfs-ganesha
  storageNamespace: nfs-ganesha
  chart:
    spec:
      chart: nfs-server-provisioner
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: nfs-ganesha
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: nfs-ganesha-helm-values
