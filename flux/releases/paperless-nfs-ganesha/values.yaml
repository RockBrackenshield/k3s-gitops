replicaCount: 1
persistence:
  enabled: true
  storageClass: "longhorn-usb"
  size: 20Gi
storageClass:
  name: nfs-ganesha-paperless
  reclaimPolicy: Retain
  archiveOnDelete: "true"
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: "192.168.7.207"
