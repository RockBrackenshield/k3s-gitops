apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-helm-values
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: not-used
                annotations:
                  helm.sh/resource-policy: keep
