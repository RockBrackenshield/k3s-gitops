# k3s-gitops/infrastructure/zot/values.yaml
replicaCount: 1

image:
  repository: ghcr.io/project-zot/zot
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: registry.hermnet.org
      paths:
        - path: /
  tls:
    - secretName: wildcard-hermnet-org-tls
      hosts:
        - registry.hermnet.org

httpGet:
  scheme: HTTP
  port: 5000

# Registry blob storage: mount the pre-created, VolSync-backed PVC rather
# than let the chart provision one, so its lifecycle is decoupled from the
# Helm release (see pvc-registry.yaml's Prune=false annotation).
persistence: true
pvc:
  create: false
  name: zot-registry
  accessModes: ["ReadWriteOnce"]

# Single RWO volume + single replica: force Recreate so a rolling update
# never tries to schedule two pods against the same volume at once.
strategy:
  type: Recreate

# Both of these are mounted from externally managed resources (see
# configmap-config.yaml and sealedsecret-htpasswd.yaml) rather than
# generated by the chart from inline values, so config and credentials
# stay in git/Sealed Secrets instead of Helm-owned state.
mountConfig: true
configFiles: {}

mountSecret: true
secretFiles: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
