apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: zot
  targetNamespace: zot
  storageNamespace: zot
  chart:
    spec:
      chart: zot
      version: "0.1.122"
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
  install:
    crds: Create
    serverSideApply: false
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    serverSideApply: disabled
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: zot-helm-values
