apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: csi-driver-smb
  targetNamespace: csi-driver-smb
  storageNamespace: csi-driver-smb
  chart:
    spec:
      chart: csi-driver-smb
      version: "1.20.3"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
  valuesFrom:
    - kind: ConfigMap
      name: csi-driver-smb-helm-values
