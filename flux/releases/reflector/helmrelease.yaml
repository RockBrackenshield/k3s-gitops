apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: reflector
  targetNamespace: reflector
  storageNamespace: reflector
  chart:
    spec:
      chart: reflector
      version: "10.0.47"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: false
  driftDetection:
    mode: warn
