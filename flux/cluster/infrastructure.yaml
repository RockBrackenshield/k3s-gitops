  timeout: 10m
  path: ./flux/releases/cert-manager
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./infrastructure/cert-manager
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
    - name: cert-manager
    - name: cert-manager-secrets
  patches:
    # Staging issuer until the switch PR removes this patch (plan v3 section 1).
    - target:
        kind: Certificate
        name: wildcard-hermnet-org
      patch: |
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: wildcard-hermnet-org
        spec:
          issuerRef:
            name: letsencrypt-staging
            kind: ClusterIssuer
    # Old cluster's SealedSecret; the new cluster has no SealedSecret CRD. Replaced by flux/secrets/cert-manager.
    - target:
        kind: SealedSecret
        name: cloudflare-api-token
      patch: |
        $patch: delete
        apiVersion: bitnami.com/v1alpha1
        kind: SealedSecret
        metadata:
          name: cloudflare-api-token
