apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./infrastructure/authentik
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
    - name: traefik-config
    - name: longhorn-config
    - name: volsync
    - name: authentik-secrets
  patches:
    # Old cluster's SealedSecrets; replaced by flux/secrets/authentik (fresh values, no DB restore).
    - target:
        kind: SealedSecret
        name: authentik-config
      patch: |
        $patch: delete
        apiVersion: bitnami.com/v1alpha1
        kind: SealedSecret
        metadata:
          name: authentik-config
    - target:
        kind: SealedSecret
        name: authentik-postgresql-credentials
      patch: |
        $patch: delete
        apiVersion: bitnami.com/v1alpha1
        kind: SealedSecret
        metadata:
          name: authentik-postgresql-credentials
    # The namespace is created by authentik-secrets so the secrets exist before the workloads (no wait deadlock).
    - target:
        kind: Namespace
        name: authentik
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: authentik
